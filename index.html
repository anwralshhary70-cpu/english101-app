<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English 101 – AI & Cybersecurity</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --success-color: #22c55e;
            --error-color: #ef4444;
        }

        /* حماية ضد تحديد النصوص */
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        h1 {
            color: var(--accent-color);
            margin-bottom: 5px;
        }

        .author {
            color: var(--text-secondary);
            font-weight: bold;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background-color: var(--accent-color);
            color: #000;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .word-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .word-title {
            font-size: 1.4rem;
            color: var(--accent-color);
            font-weight: bold;
        }

        .audio-btn {
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .detail-item {
            background-color: rgba(255, 255, 255, 0.05);
            padding: 8px 12px;
            border-radius: 6px;
        }

        .detail-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: block;
        }

        .quiz-option {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 8px;
            cursor: pointer;
            text-align: right;
            transition: background-color 0.2s;
        }

        .quiz-option:hover {
            background-color: rgba(56, 189, 248, 0.2);
        }

        .quiz-option.correct {
            background-color: var(--success-color) !important;
            color: #fff;
        }

        .quiz-option.incorrect {
            background-color: var(--error-color) !important;
            color: #fff;
        }

        footer {
            margin-top: auto;
            padding-top: 20px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
            width: 100%;
        }

        footer strong {
            color: #ef4444; /* باللون الأحمر كما طلبت */
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="container">
        <header>
            <h1>English 101 – AI & Cybersecurity</h1>
            <div class="author">إعداد الطالب : أنور الشهاري</div>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('vocab')">المفردات والشرح</button>
            <button class="tab-btn" onclick="switchTab('quiz')">الاختبار التفاعلي</button>
        </div>

        <!-- قسم المفردات -->
        <div id="vocab" class="tab-content active">
            <div id="vocab-list"></div>
        </div>

        <!-- قسم الاختبار -->
        <div id="quiz" class="tab-content">
            <div class="card" id="quiz-card">
                <div class="word-title" id="quiz-question" style="margin-bottom: 15px;"></div>
                <div id="quiz-options"></div>
                <div id="quiz-feedback" style="margin-top: 15px; font-weight: bold;"></div>
            </div>
        </div>
    </div>

    <footer>
        <strong>إعداد الطالب : أنور الشهاري</strong>
    </footer>

    <script>
        // بيانات المفردات الخاصة بمادة الإنجليزي - الأمن السيبراني والذكاء الاصطناعي
        const vocabulary = [
            { word: "Cybersecurity", type: "noun", meaning: "الأمن السيبراني", synonym: "Digital Security", antonym: "Vulnerability" },
            { word: "Encryption", type: "noun", meaning: "التشفير", synonym: "Encoding / Cryptography", antonym: "Decryption" },
            { word: "Vulnerability", type: "noun", meaning: "ثغرة أمنية", synonym: "Weakness / Flaw", antonym: "Security / Protection" },
            { word: "Algorithm", type: "noun", meaning: "خوارزمية", synonym: "Procedure / Formula", antonym: "Randomness" },
            { word: "Authentication", type: "noun", meaning: "المصادقة / التحقق", synonym: "Verification", antonym: "Impersonation" },
            { word: "Firewall", type: "noun", meaning: "جدار حماية", synonym: "Security Barrier", antonym: "Open Access" },
            { word: "Malware", type: "noun", meaning: "برمجيات خبيثة", synonym: "Malicious Software", antonym: "Antivirus / Clean Software" },
            { word: "Artificial Intelligence", type: "noun", meaning: "الذكاء الاصطناعي", synonym: "Machine Intelligence", antonym: "Natural Intelligence" }
        ];

        // عرض قائمة المفردات
        function renderVocab() {
            const listContainer = document.getElementById('vocab-list');
            listContainer.innerHTML = '';
            
            vocabulary.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="word-header">
                        <div>
                            <span class="word-title">${item.word}</span>
                            <small style="color: var(--text-secondary)">(${item.type})</small>
                        </div>
                        <button class="audio-btn" onclick="speak('${item.word}')">🔊</button>
                    </div>
                    <div class="details-grid">
                        <div class="detail-item">
                            <span class="detail-label">المعنى</span>
                            <strong>${item.meaning}</strong>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">المرادف (Synonym)</span>
                            <strong>${item.synonym}</strong>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">المضاد (Antonym)</span>
                            <strong>${item.antonym}</strong>
                        </div>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        // تحويل النص إلى صوت (النطق الإنجليزي)
        function speak(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            }
        }

        // التبديل بين التبويبات
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');

            if (tabId === 'quiz') {
                loadQuiz();
            }
        }

        // نظام الاختبار التفاعلي
        let currentQuizIndex = 0;
        function loadQuiz() {
            const item = vocabulary[currentQuizIndex];
            document.getElementById('quiz-question').innerText = `ما هو معنى الكلمة: "${item.word}"؟`;
            
            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';
            document.getElementById('quiz-feedback').innerText = '';

            // تجميع الخيارات وتحريكها عشوائياً
            let options = [item.meaning];
            while (options.length < 3) {
                let randomWord = vocabulary[Math.floor(Math.random() * vocabulary.length)].meaning;
                if (!options.includes(randomWord)) {
                    options.push(randomWord);
                }
            }
            options.sort(() => Math.random() - 0.5);

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'quiz-option';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(btn, opt === item.meaning);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(btn, isCorrect) {
            const feedback = document.getElementById('quiz-feedback');
            if (isCorrect) {
                btn.classList.add('correct');
                feedback.innerText = "إجابة صحيحة! أحسنت 👏";
                feedback.style.color = "var(--success-color)";
                setTimeout(() => {
                    currentQuizIndex = (currentQuizIndex + 1) % vocabulary.length;
                    loadQuiz();
                }, 1500);
            } else {
                btn.classList.add('incorrect');
                feedback.innerText = "إجابة خاطئة، حاول مرة أخرى!";
                feedback.style.color = "var(--error-color)";
            }
        }

        // حماية ضد أدوات المطورين (Developer Tools & Shortcuts)
        document.onkeydown = function(e) {
            if (e.keyCode == 123 || 
                (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || 
                (e.ctrlKey && e.keyCode == 85)) {
                return false;
            }
        };

        // تهيئة التطبيق عند الفتح
        window.onload = renderVocab;
    </script>
</body>
  </html>
